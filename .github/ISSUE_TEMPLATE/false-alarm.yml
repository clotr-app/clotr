name: False alarm
description: Clotr warned about something that isn't sensitive.
title: "False alarm: "
labels: ["false alarm"]
body:
  - type: markdown
    attributes:
      value: "**Never paste a real password, key or personal detail here.** Describe its shape instead, or change the digits/letters so it keeps the same pattern."
  - type: input
    id: kind
    attributes:
      label: What Clotr said it found
      placeholder: "Phone Number"
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: The text (made safe)
      description: The part that triggered it, with anything real changed. For example "build 1c9e6679-7425-40de" or "my score was 3/6".
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site (optional)
      placeholder: "chatgpt.com, mail.google.com"
  - type: input
    id: version
    attributes:
      label: Clotr version
      description: brave://extensions or chrome://extensions → Clotr
      placeholder: "0.9.17-alpha"
  - type: textarea
    id: summary
    attributes:
      label: Clotr's summary (paste it here if you like)
      description: "Optional. In Clotr, Report a problem → *Add what Clotr counted* → *Copy it*. It holds kinds and counts only: no details, sites or times. This page is public, so delete any line you'd rather keep to yourself."
      render: text
