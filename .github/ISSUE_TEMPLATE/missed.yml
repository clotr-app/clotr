name: Missed something
description: Clotr didn't warn about something sensitive.
title: "Missed: "
labels: ["missed detection"]
body:
  - type: markdown
    attributes:
      value: "**Never paste the real value.** Describe how it was written: for example \"a phone number spelled out with 'oh' for zero\" or \"a key starting with sk-proj- followed by 40 characters\"."
  - type: textarea
    id: shape
    attributes:
      label: What was missed, and how it was written
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Site
      placeholder: "gemini.google.com, discord.com"
  - type: input
    id: version
    attributes:
      label: Clotr version
      placeholder: "0.9.17-alpha"
  - type: textarea
    id: summary
    attributes:
      label: Clotr's summary (paste it here if you like)
      description: "Optional. In Clotr, Report a problem → *Add what Clotr counted* → *Copy it*. It holds kinds and counts only: no details, sites or times. This page is public, so delete any line you'd rather keep to yourself."
      render: text
