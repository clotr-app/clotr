# Runs on a version tag like v0.9.47. Tests the code, builds the Chrome and Firefox zips, proves the build is
# reproducible, and creates a draft GitHub release holding the zips, their SPDX SBOMs and SHA256SUMS.txt. In the
# public repo it also attaches a signed build-provenance attestation, which anyone can check with
# `gh attestation verify <zip> -R <repo>`. Nothing goes out until a maintainer reviews the draft and presses Publish.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only the release job gets write access, since it's the one that creates the draft.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creating the draft release and uploading its files
      id-token: write # the provenance attestation's signing identity (public repo only)
      attestations: write # storing that attestation with the repo
    steps:
      # Every action is pinned to an exact commit, so a moved tag can't change what runs. The version tag stays in
      # the trailing comment for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A release installs straight from the lockfile, never from a cache another run wrote, so there's no
      # dependency cache here. setup-node v5 and later can cache on their own, which is why it's turned off.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: The tag matches the extension's version
        run: |
          version="v$(node -p "require('./extension/manifest.json').version")"
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but manifest says $version"; exit 1; }
      - name: Build (Chrome, Brave, Edge and Firefox)
        run: |
          npm run package
          npm run package -- --firefox
      - name: Reproducible - a second build must be byte-identical
        run: |
          node tools/package.js --out "$RUNNER_TEMP/again"
          node tools/package.js --firefox --out "$RUNNER_TEMP/again"
          diff <(sort dist/SHA256SUMS.txt) <(sort "$RUNNER_TEMP/again/SHA256SUMS.txt")
      - name: Save the checksums for the second-OS rebuild to compare against
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256sums-ubuntu
          path: dist/SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.spdx.json dist/SHA256SUMS.txt --draft \
            --title "Clotr $GITHUB_REF_NAME" \
            --notes "Install: unzip, then Load unpacked in chrome://extensions (Developer mode), or use the store listing. Verify: \`sha256sum -c SHA256SUMS.txt\`, or rebuild from this tag with \`npm ci && npm run package\` and compare. Provenance: \`gh attestation verify <zip> -R $GITHUB_REPOSITORY\`."
      # A signed record of which workflow run built each zip from which commit, the SLSA provenance that's free on
      # public repos.
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

  # Rebuilds the same tag on a different operating system and checks the zips still hash the same, so
  # "rebuild it yourself and compare" is true on any computer, not just a second run of the same runner image.
  reproduce-second-os:
    needs: release
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # gh run download reads this run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        shell: bash
      - name: Build (Chrome, Brave, Edge and Firefox)
        shell: bash
        run: |
          npm run package
          npm run package -- --firefox
      - name: Get the Ubuntu build's checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} -n sha256sums-ubuntu -D ubuntu-sums
      - name: Same tag, same hashes, different operating system
        shell: bash
        run: diff dist/SHA256SUMS.txt ubuntu-sums/SHA256SUMS.txt
