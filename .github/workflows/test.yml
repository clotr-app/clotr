# Unit, rule and end-to-end tests, in headless Chrome and Firefox against the fake AI pages (no real sites).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same PR replaces its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the tests only read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to exact commits (a moved tag can't change what runs); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in dev dependencies
        run: npm audit --audit-level=high
      - run: npm test
      - name: Formatting and lint
        run: npm run lint
      - name: End-to-end (headless Chrome)
        run: npm run test:e2e -- --browser /usr/bin/google-chrome
        env:
          # Ubuntu 24.04 runners block Chrome's user-namespace sandbox.
          PUPPETEER_DANGEROUS_NO_SANDBOX: "true"
      - name: Firefox smoke test
        run: |
          FF="$(npx -y @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}' | tail -n 1)"
          npm run test:firefox -- --browser "$FF"
      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output
          path: tests/e2e/output/
          if-no-files-found: ignore
          retention-days: 7 # screenshots and reports: a week is enough to look
