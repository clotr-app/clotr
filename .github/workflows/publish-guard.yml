# Publishes Clotr Guard to npm with provenance, a signed record of which commit and which workflow run built the
# package, which npm shows on the package page and `npm audit signatures` checks after an install. It runs only when
# someone starts it from the Actions tab on one of Guard's own tags (guard-v0.1.0 for Guard 0.1.0), never on a push, a
# pull request or a schedule. Each product has its own tag: Guard's start with "guard-", the engine's with "engine-"
# (publish-engine.yml), and the extension's Release workflow builds only on a "v" and a digit.
name: Publish Clotr Guard

on:
  workflow_dispatch:

# Read-only by default, as every workflow here is. Only the publish job gets an ID token.
permissions:
  contents: read

jobs:
  publish:
    # npm signs provenance only on GitHub's own runners.
    runs-on: ubuntu-latest
    timeout-minutes: 30 # npm test before the publish takes about 20 minutes with Guard's tests
    # What gates this run: only someone with write access can start it, the first step stops it unless it was started
    # on a guard-v tag, and npm takes the package only from this workflow in the npm environment, through the trusted
    # publisher set on npmjs.com. The environment has no required reviewer, so nobody approves the run once it starts.
    environment:
      name: npm
      url: https://www.npmjs.com/package/clotr-guard
    permissions:
      contents: read
      id-token: write # the identity npm signs the provenance with, and trusted publishing's sign-in
    steps:
      - name: Only from one of Guard's tags
        run: |
          case "$GITHUB_REF" in
            refs/tags/guard-v*) ;;
            *) echo "Start this from one of Guard's tags (guard-v...), not $GITHUB_REF"; exit 1 ;;
          esac
      # Pinned to the same commits as the release workflow, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 comes with npm 11, which can sign in through a trusted publisher as well as sign provenance.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Guard's version is the tag's
        run: |
          guard="guard-v$(node -p "require('./apps/guard/package.json').version")"
          test "$guard" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Guard says $guard"; exit 1; }
      # Guard's package.json says "private": true, so npm refuses to publish it from anyone's clone by mistake. This
      # run, started by hand from a Guard tag, is the one place it comes off, in this runner only.
      - name: Let npm publish this copy
        working-directory: apps/guard
        run: npm pkg delete private
      # prepack builds dist/clotr-engine.js from this checkout before the tarball is made, so Guard carries the engine
      # in the tagged tree whatever version npm's clotr-engine is at. With a trusted publisher set up on npmjs.com,
      # npm signs in through this run's ID token and NPM_TOKEN can be left unset.
      - name: Publish with provenance
        working-directory: apps/guard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
