name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the full suite, unsharded, against a built zip instead of extension/ straight (30-40 min, 9 Oct)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end against the packaged build (headless Chrome)
        run: npm run test:e2e:packaged -- --browser /usr/bin/google-chrome
        env:
          # Ubuntu 24.04 runners block Chrome's user-namespace sandbox.
          PUPPETEER_DANGEROUS_NO_SANDBOX: "true"
      - name: Add the packaged suite's result to the run summary
        if: always()
        run: |
          echo "### Browser suite, packaged build" >> "$GITHUB_STEP_SUMMARY"
          { grep -m1 '^- Result:' tests/e2e/output/report.md || echo "- no report written"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload e2e report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-packaged
          path: tests/e2e/output/
          if-no-files-found: ignore
          retention-days: 7 # screenshots and reports: a week is enough to look
