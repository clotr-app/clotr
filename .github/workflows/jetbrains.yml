# Builds the JetBrains plugin (apps/jetbrains) and runs its platform tests against the IntelliJ version its build
# names. Before Gradle runs anything, the committed wrapper jar is checked against Gradle's published checksums, since
# gradlew runs that jar with this job's access. Runs only when the plugin, Guard (whose CLI its setup drives), the
# engine or the scripts and test vectors its build and tests read changed, so the extension's own pull requests don't
# wait for an IDE download. The plugin's Node tests run with everything else in the Tests workflow.
name: JetBrains

on:
  push:
    branches: [main]
    paths:
      - "apps/jetbrains/**"
      - "apps/guard/**"
      - "apps/engine/**"
      - "extension/**"
      - "tools/engine-bundle.js"
      - "tools/sync-secret-files.js"
      - "tests/clotrignore-vectors.txt"
      - ".github/workflows/jetbrains.yml"
  pull_request:
    paths:
      - "apps/jetbrains/**"
      - "apps/guard/**"
      - "apps/engine/**"
      - "extension/**"
      - "tools/engine-bundle.js"
      - "tools/sync-secret-files.js"
      - "tests/clotrignore-vectors.txt"
      - ".github/workflows/jetbrains.yml"
  workflow_dispatch:

# A newer push to the same PR replaces its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The build only needs to read the code, so that's all it's given.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/jetbrains
    steps:
      # Every action is pinned to an exact commit, so a moved tag can't change what runs. The version tag stays in
      # the trailing comment for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The committed Gradle wrapper jar is the one Gradle published
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      # Node builds the engine bundle and the secret-file list, and the tests drive Guard's CLI with it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Platform tests
        # gradlew is committed without its executable bit, so it's run through sh.
        run: sh ./gradlew test --console=plain
