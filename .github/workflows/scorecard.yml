# OpenSSF Scorecard scores this repo's security practices every week and on each push to main, then publishes the
# result the README's badge shows. It only runs on the public repo, and is skipped in a private one.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Read-only by default. The job can only upload its results and sign them for the badge.
permissions:
  contents: read

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # the results in the Security tab (code scanning)
      id-token: write # publishing them for the badge
    steps:
      # Every action is pinned to an exact commit, so a moved tag can't change what runs. The version tag stays in
      # the trailing comment for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
