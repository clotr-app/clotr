# CodeQL reads the code for security problems on every pull request, each push to main and once a week, and puts
# what it finds in the Security tab. It covers the workflows, the JavaScript (the extension, the developer tools and
# the scripts) and the JetBrains plugin's Kotlin. CodeQL can only read Kotlin while it's being compiled, so that job
# builds apps/jetbrains itself, with the same Java and Gradle setup as the JetBrains workflow.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

# A newer push to the same PR replaces its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. The analysis can only add its results to the Security tab.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # the results in the Security tab (code scanning)
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      # Every action is pinned to an exact commit, so a moved tag can't change what runs. The version tag stays in
      # the trailing comment for reference.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Kotlin job checks the committed wrapper jar against Gradle's published checksums before anything runs
      # it, then sets up what the plugin's build needs: Java 21, and Node for the engine bundle it packs.
      - name: The committed Gradle wrapper jar is the one Gradle published
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile the JetBrains plugin while CodeQL watches
        if: matrix.build-mode == 'manual'
        working-directory: apps/jetbrains
        # The flags make sure the Kotlin really compiles under CodeQL, instead of Gradle reusing a cached result or a
        # daemon started before CodeQL was. gradlew is committed without its executable bit, so it's run through sh.
        run: >-
          sh ./gradlew --no-daemon --no-configuration-cache --no-build-cache --console=plain
          compileKotlin compileTestKotlin
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
