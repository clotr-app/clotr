# Updates the npm packages and the pinned GitHub Actions once a month, each as one grouped pull request, and only
# takes versions that have been out for a week, since a hijacked release is usually caught within days. I review
# and merge these by hand, since dependency files are guard rails and nothing merges them on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
