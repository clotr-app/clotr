<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Clotr</title>

    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="shield.css" />
    <link rel="stylesheet" href="flyout.css" />
    <script defer src="dist/app-words.js"></script>
    <script defer src="words.js"></script>
    <script defer src="tauri.js"></script>
    <script defer src="flyout.js"></script>
  </head>
  <body class="flyout">
    <div class="panel glass flyout-panel" id="flyout-panel">
      <div class="flyout-head">
        <div class="shield still" id="flyout-shield" data-status="quiet" aria-hidden="true">
          <svg viewBox="0 0 196 196" focusable="false">
            <defs>
              <linearGradient id="shield-line" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="g1" /><stop offset="1" class="g2" /></linearGradient>
              <linearGradient id="shield-seam" gradientUnits="userSpaceOnUse" x1="0" y1="54" x2="0" y2="146"><stop offset="0" class="g2" /><stop offset="1" class="g1" /></linearGradient>
            </defs>
            <path class="o draw" pathLength="1" style="--d: 1.8s" d="M98 12 C126 24 150 28 172 30 V92 C172 136 140 166 98 184 C56 166 24 136 24 92 V30 C46 28 70 24 98 12 Z" />
            <path class="i1 draw" pathLength="1" style="--d: 1.6s; --w: 0.25s" transform="translate(98 98) scale(0.84) translate(-98 -98)" d="M98 12 C126 24 150 28 172 30 V92 C172 136 140 166 98 184 C56 166 24 136 24 92 V30 C46 28 70 24 98 12 Z" />
            <path class="i2 draw" pathLength="1" style="--d: 1.5s; --w: 0.45s" transform="translate(98 98) scale(0.68) translate(-98 -98)" d="M98 12 C126 24 150 28 172 30 V92 C172 136 140 166 98 184 C56 166 24 136 24 92 V30 C46 28 70 24 98 12 Z" />
            <path class="k draw" pathLength="1" style="--d: 0.8s; --w: 1.1s" d="M98 54 L98 146" />
            <path class="k st draw" pathLength="1" style="--d: 0.28s; --w: 1.70s" d="M88 61 L108 71" />
            <path class="k st draw" pathLength="1" style="--d: 0.28s; --w: 1.88s" d="M88 78 L108 88" />
            <path class="k st draw" pathLength="1" style="--d: 0.28s; --w: 2.06s" d="M88 95 L108 105" />
            <path class="k st draw" pathLength="1" style="--d: 0.28s; --w: 2.24s" d="M88 112 L108 122" />
            <path class="k st draw" pathLength="1" style="--d: 0.28s; --w: 2.42s" d="M88 129 L108 139" />
            <path class="glint" pathLength="1" d="M98 12 C126 24 150 28 172 30 V92 C172 136 140 166 98 184 C56 166 24 136 24 92 V30 C46 28 70 24 98 12 Z" />
            <g class="flag" transform="translate(152 34)"><circle class="f" r="13" /><path d="M0 -6 V1.5" /><circle class="d" cy="6" r="1.6" /></g>
          </svg>
        </div>
        <div class="flyout-words" role="status">
          <h1 id="flyout-title"></h1>
          <p id="flyout-kicker"></p>
          <p id="flyout-typing-blind" hidden></p>
        </div>
      </div>
      <nav class="flyout-actions" id="flyout-actions">
        <button class="btn sm" type="button" id="flyout-open"></button>
        <button class="btn sm" type="button" id="flyout-scan"></button>
        <button class="btn sm" type="button" id="flyout-pause"></button>
        <button class="btn sm" type="button" id="flyout-quit"></button>
      </nav>
    </div>
  </body>
</html>
