            <section class="card" aria-labelledby="data-title">
              <h2 id="data-title" data-w="ws.yourData"></h2>
              <p class="muted" data-w="settings.storesText"></p>
              <p class="muted" id="ignored-count"></p>
              <p class="muted" id="full-scan-kept"></p>
              <p class="btn-row"><button class="btn sm" id="show-ignored" type="button" data-w="settings.showIgnored"></button></p>
              <h3 data-w="settings.moveTitle"></h3>
              <p class="muted small" data-w="settings.moveHint"></p>
              <form id="move" class="move">
                <label for="move-file" data-w="settings.moveFile"></label>
                <input id="move-file" type="file" accept=".clotr,application/json" required />
                <label for="move-password" data-w="settings.movePassword"></label>
                <input id="move-password" type="password" autocomplete="off" required />
                <p class="btn-row"><button class="btn primary sm" type="submit" data-w="settings.moveOpen"></button></p>
              </form>
              <p id="move-status" class="status" role="status"></p>
            </section>
            <section class="card" aria-labelledby="accuracy-title">
              <h2 id="accuracy-title" data-w="settings.accuracyTitle"></h2>
              <p class="muted" data-w="settings.accuracyHint"></p>
              <p class="muted" id="accuracy-count"></p>
              <p class="btn-row">
                <button class="btn sm" id="accuracy-export" type="button" data-w="settings.accuracyExport"></button>
                <button class="btn sm" id="accuracy-clear" type="button" data-w="settings.accuracyClear"></button>
              </p>
              <p id="accuracy-status" class="status" role="status"></p>
            </section>
            <section class="card" aria-labelledby="about-title">
              <h2 id="about-title" data-w="ws.aboutTitle"></h2>
              <p class="muted" data-w="ws.about"></p>
              <p class="small muted" id="about-version"></p>
              <p class="btn-row">
                <button class="btn sm" id="about-report" type="button" data-w="ws.reportProblem"></button>
              </p>
            </section>
          </div>
        </section>

        <section class="screen" data-screen="scamcheck" id="screen-scamcheck" aria-labelledby="title-scamcheck">
          <header class="screen-head">
            <h1 id="title-scamcheck" tabindex="-1"></h1>
            <p id="sc-lead"></p>
          </header>
          <section class="card sc-ask" id="sc-ask" aria-labelledby="title-scamcheck">
            <label class="lb-letter-label" for="sc-message" id="sc-box-label"></label>
            <textarea class="lb-letter-box" id="sc-message" rows="7" autocomplete="off" spellcheck="false"></textarea>
            <p id="sc-empty" class="note" role="status" hidden></p>
            <p class="btn-row">
              <button class="btn primary" type="button" id="sc-check"></button>
              <button class="btn text" type="button" id="sc-try"></button>
            </p>
          </section>
          <section class="card sc-result" id="sc-result" hidden aria-labelledby="title-scamcheck">
            <div id="sc-found" hidden>
              <h2 id="sc-found-title" tabindex="-1"></h2>
            </div>
            <div id="sc-none" hidden>
              <h2 id="sc-none-title" tabindex="-1"></h2>
              <p id="sc-none-why"></p>
            </div>
            <p id="sc-marked" class="muted"></p>
            <div id="sc-signs"></div>
            <section class="card" aria-labelledby="sc-before-title">
              <h3 id="sc-before-title"></h3>
              <ul>
                <li id="sc-before-call"></li>
                <li id="sc-before-talk"></li>
                <li id="sc-before-phone-row" class="strong" hidden><span id="sc-before-phone"></span></li>
                <li id="sc-before-link-row" class="strong" hidden><span id="sc-before-link"></span></li>
              </ul>
              <p id="sc-before-sources" class="source"></p>
            </section>
            <section class="card sc-ask-someone" id="sc-ask-someone" hidden aria-labelledby="sc-ask-someone-title">
              <h3 id="sc-ask-someone-title"></h3>
              <p id="sc-ask-someone-text"></p>
              <p class="btn-row">
                <button class="btn" type="button" id="sc-ask-someone-copy"></button>
              </p>
              <p class="note" role="status" id="sc-ask-someone-copied" hidden></p>
            </section>
            <p class="btn-row">
              <button class="btn" type="button" id="sc-again"></button>
              <a class="btn text" href="#home" data-w="ws.back"></a>
            </p>
          </section>
          <p id="sc-failed" class="note" role="alert" hidden></p>
          <p class="small muted" id="sc-never"></p>
        </section>
      </main>
    </div>

    <p class="toast" id="saved" role="status"></p>
  </body>
</html>
