<!doctype html>
<!-- Stand-in for Startpage's box: a plain text input in a form, Enter or the Search button submits. -->
<html lang="en">
<head><meta charset="utf-8"><title>Startpage (Clotr test page)</title></head>
<body>
  <form id="q-form" action="/sp/search" method="GET">
    <input type="text" id="q" name="query" aria-label="Search">
    <button type="submit" id="search-button" aria-label="Search">Search</button>
  </form>
  <script>
    window.__sent = [];
    document.getElementById("q-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const box = document.getElementById("q");
      if (!box.value) return;
      window.__sent.push(box.value);
      box.value = "";
    });
  </script>
</body>
</html>
