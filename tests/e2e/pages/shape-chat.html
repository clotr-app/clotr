<!doctype html>
<!-- Stand-in for a white-labeled AI chat with no "ai" wording anywhere in its address, title or meta
     description, and no "ask"/"message"/"prompt"-style placeholder either: the only thing that gives it away
     is its shape, a multi-line box with a send-like control nearby. -->
<html lang="en">
<head><meta charset="utf-8"><title>Customer Support</title></head>
<body>
  <h1>Customer Support</h1>
  <textarea id="box" placeholder="Type here" rows="4" cols="60"></textarea>
  <button id="send" aria-label="Send">Send</button>
</body>
</html>
