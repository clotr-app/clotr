<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Yahoo Mail reply (Clotr test page)</title></head>
<body>
  <div id="body" role="textbox" contenteditable="true" aria-label="Message Body" aria-multiline="true">
    <div id="reply">Jerry,</div>
    <div id="signature">
      <p>Best,<br><strong>Example sender</strong></p>
      <a id="signature-link" href="#signature">Example profile</a>
      <img id="signature-image" alt="" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" width="1" height="1">
      <ul id="signature-list"><li>Example role</li><li>Contact details</li></ul>
    </div>
    <div id="email-history">
      <div>On Monday, Professor Example &lt;professor@example.test&gt; wrote:</div>
      <blockquote type="cite">
        <div class="quote-body" id="quote-body">My email is professor@example.test. Please copy student@example.test and helper@example.test. Call me at 555-555-0123.</div>
      </blockquote>
    </div>
  </div>
  <button id="send" type="button">Send</button>
</body>
</html>
