<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Gmail forward (Clotr test page)</title></head>
<body>
  <div id="body" role="textbox" contenteditable="true" aria-label="Message Body" aria-multiline="true">
    <div id="reply">Hi,</div>
    ---------- Forwarded message ---------
    <div class="gmail_quote">
      <div class="gmail_attr">From: Professor Example &lt;professor@example.test&gt;</div>
      <blockquote class="gmail_quote">
        <div class="quote-body">To: student@example.test<br>Cc: helper@example.test<br>API key: <span id="demo-key"></span></div>
      </blockquote>
    </div>
  </div>
  <button id="send" type="button">Send</button>
  <script>document.getElementById("demo-key").textContent = ["AKIA", "4HPQ7XZ2", "R6TWLJ3N"].join("");</script>
</body>
</html>
