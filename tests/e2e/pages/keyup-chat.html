<!doctype html>
<!-- Stand-in for a chat app that sends on Enter key-up (or keypress) in its own window-level listener,
     registered by the page's script (so before a content script injected at document_idle).
     Clotr must still get the first word: it starts at document_start. -->
<html lang="en">
<head><meta charset="utf-8"><title>Key-up chat (Clotr test page)</title>
<script>
  window.__sent = [];
  window.addEventListener(window.__sendOn || "keyup", (e) => {
    const box = document.getElementById("msg");
    if (e.key !== "Enter" || e.shiftKey || e.target !== box || !box.value.trim()) return;
    e.preventDefault();
    window.__sent.push(box.value);
    box.value = "";
  }, true);
</script>
</head>
<body>
  <textarea id="msg" rows="3" cols="60"></textarea>
  <button id="send" aria-label="Send message">Send</button>
  <script>
    document.getElementById("send").addEventListener("click", () => {
      const box = document.getElementById("msg");
      if (!box.value.trim()) return;
      window.__sent.push(box.value);
      box.value = "";
    });
  </script>
</body>
</html>
